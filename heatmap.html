

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Pro - Order Flow Heatmap</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #080d18;
  color: #e8edf7;
  font-family: Arial, sans-serif;
}
header {
  padding: 16px;
  background: #111a2b;
  border-bottom: 1px solid #26344d;
}
h2 {
  margin: 0;
  color: #f5c542;
}
.subtitle {
  color: #91a0b8;
  font-size: 12px;
  margin-top: 6px;
}
.container {
  padding: 12px;
  max-width: 900px;
  margin: auto;
}
.panel {
  background: #111a2b;
  border: 1px solid #26344d;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
select, button {
  background: #202d43;
  color: white;
  border: 1px solid #40516c;
  border-radius: 6px;
  padding: 10px;
}
button {
  background: #176b45;
  font-weight: bold;
}
.status {
  color: #f5c542;
  font-size: 13px;
  margin-top: 10px;
}
.price {
  font-size: 25px;
  font-weight: bold;
  margin-top: 12px;
}
.small {
  color: #91a0b8;
  font-size: 12px;
}
.bookrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 7px 0;
  font-size: 13px;
}
.level {
  width: 90px;
  text-align: right;
}
.barbox {
  flex: 1;
  height: 18px;
  background: #202d43;
  border-radius: 3px;
  overflow: hidden;
}
.bar {
  height: 100%;
  min-width: 1px;
}
.bidbar {
  background: #087c55;
}
.askbar {
  background: #a52d45;
}
</style>
</head>

<body>
<header>
  <h2>FOREX PRO - ORDER FLOW</h2>
  <div class="subtitle">Live Binance Order Book Heatmap</div>
</header>

<div class="container">

  <div class="panel">
    <div class="row">
      <b>Market Selection</b>
      <select id="pair">
        <option value="btcusdt">BTC / USDT</option>
        <option value="ethusdt">ETH / USDT</option>
      </select>
    </div>
    <div class="price" id="price">Connecting...</div>
    <div class="status" id="status">Waiting for live data...</div>
    <div class="small">Public Binance market data</div>
  </div>

  <div class="panel">
    <b>ORDER BOOK LIQUIDITY MAP</b>
    <p class="small">Red = Sell Orders | Green = Buy Orders</p>
    <div id="asks"></div>
    <hr style="border-color:#26344d">
    <div id="bids"></div>
  </div>
</div>
</body>
</html>

<script>
const pair = document.getElementById("pair");
const priceBox = document.getElementById("price");
const statusBox = document.getElementById("status");
const asksBox = document.getElementById("asks");
const bidsBox = document.getElementById("bids");

let socket = null;

function connect() {
  if (socket) socket.close();

  const symbol = pair.value;

  priceBox.textContent = "Connecting...";
  statusBox.textContent = "Connecting to Binance...";
  asksBox.innerHTML = "";
  bidsBox.innerHTML = "";

  socket = new WebSocket(
    "wss://stream.binance.com:9443/stream?streams=" +
    symbol + "@depth20@100ms/" +
    symbol + "@trade"
  );

  socket.onopen = () => {
    statusBox.textContent = "LIVE DATA CONNECTED";
  };

  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    const data = msg.data;

    if (data.e === "trade") {
      priceBox.textContent =
        Number(data.p).toLocaleString("en-US", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " USDT";
    }

    if (data.lastUpdateId && data.bids && data.asks) {
      showBook(data.bids, data.asks);
    }
  };

  socket.onerror = () => {
    statusBox.textContent = "Connection error";
  };

  socket.onclose = () => {
    statusBox.textContent = "Connection closed";
  };
}

function showBook(bids, asks) {
  const maxQty = Math.max(
    1,
    ...bids.map(x => Number(x[1])),
    ...asks.map(x => Number(x[1]))
  );

  function makeRows(levels, type) {
    return levels.slice(0, 20).map(level => {
      const p = Number(level[0]);
      const q = Number(level[1]);
      const width = Math.max(1, q / maxQty * 100);

      return `
        <div class="bookrow">
          <span class="level">${p.toLocaleString()}</span>
          <div class="barbox">
            <div class="bar ${type}"
                 style="width:${width}%"></div>
          </div>
          <span>${q.toFixed(4)}</span>
        </div>
      `;
    }).join("");
  }

  asksBox.innerHTML = makeRows(asks, "askbar");
  bidsBox.innerHTML = makeRows(bids, "bidbar");
}

pair.addEventListener("change", connect);
connect();
</script>
