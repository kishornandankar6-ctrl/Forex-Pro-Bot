
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forex Pro Bot</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#0b1220;color:white;font-family:Arial}
h2{text-align:center;color:#e9bd57}
.card{background:#172235;border:1px solid #30415a;padding:14px;border-radius:12px;margin:12px 0}
label{display:block;color:#9eafc5;margin:10px 0 6px;font-size:13px}
select,button{width:100%;padding:13px;border-radius:8px;background:#101b2d;color:white;border:1px solid #40516b}
button{background:#d9b04e;color:#111;font-weight:bold;margin-top:12px}
.price{font-size:27px;color:#e9bd57;font-weight:bold}
.small{font-size:12px;color:#9eafc5}
.row{display:flex;justify-content:space-between;gap:10px}
.pairrow{padding:12px 0;border-bottom:1px solid #344258}
.status{text-align:center;color:#e9bd57;font-size:13px}
.signal{text-align:center;font-size:25px;padding:15px}
</style>
</head>
<body>

<h2>FOREX PRO BOT</h2>
<div class="status" id="status">CONNECTING...</div>

<div class="card">
<label>SELECT PAIR</label>
<select id="pair" onchange="showSelected()">
<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
<option value="USDCHF">USD/CHF</option>
<option value="AUDUSD">AUD/USD</option>
<option value="NZDUSD">NZD/USD</option>
<option value="USDCAD">USD/CAD</option>
<option value="EURJPY">EUR/JPY</option>
</select>

<label>TIMEFRAME</label>
<select id="tf">
<option value="1m">1 Minute</option>
<option value="5m" selected>5 Minutes</option>
<option value="15m">15 Minutes</option>
<option value="30m">30 Minutes</option>
<option value="1h">1 Hour</option>
</select>
</div>

<div class="card">
<div class="small">SELECTED PAIR LIVE PRICE</div>
<div class="price" id="price">--</div>
<div class="small" id="details">Waiting for data</div>
</div>

<div class="card">
<b>ALL 8 FOREX PAIRS</b>
<div id="prices">Loading prices...</div>
</div>

<div class="card">
<div class="row">
<button onclick="startBot()">START BOT</button>
<button onclick="stopBot()" style="background:#a43f4b;color:white">STOP BOT</button>
</div>
<div class="status" id="botstatus">BOT OFF</div>
</div>

<div class="card">
<b>ANALYSIS STATUS</b>
<div class="signal" id="signal">WAITING FOR ANALYSIS</div>
<div class="small">Prediction engine is not connected yet.</div>
</div>

<div class="card">
<b>DATA INFORMATION</b>
<div class="small" id="updated">Last update: --</div>
<div class="small">Source: Biquote MT5 Feed</div>
<div class="small">Update interval: 5 seconds</div>
</div>

<script>
const symbols=[
"EURUSD","GBPUSD","USDJPY","USDCHF",
"AUDUSD","NZDUSD","USDCAD","EURJPY"
];

let botOn=false;
let latest={};

async function getPrices(){
const status=document.getElementById("status");

try{
const params=new URLSearchParams();
symbols.forEach(s=>params.append("symbols",s));

const response=await fetch(
"https://biquote.io/api/latest?"+params.toString(),
{cache:"no-store"}
);

if(!response.ok) throw new Error("API error "+response.status);

const data=await response.json();
latest=data;

renderPrices();
status.innerText="● DATA CONNECTION ACTIVE";
document.getElementById("updated").innerText=
"Last update: "+new Date().toLocaleTimeString();

}catch(error){
status.innerText="● CONNECTION ERROR";
document.getElementById("details").innerText=error.message;
}
}

function renderPrices(){
const box=document.getElementById("prices");
box.innerHTML="";

symbols.forEach(symbol=>{
const tick=latest[symbol];
const div=document.createElement("div");
div.className="pairrow";

if(!tick){
div.innerHTML=symbol+" - No data";
}else{
const fresh=!tick.stale && tick.marketState==="open";
div.innerHTML=
"<div class='row'><b>"+symbol+"</b><b>"+
(tick.mid??"--")+"</b></div>"+
"<div class='small'>"+
(fresh?"LIVE":"STALE / MARKET CLOSED")+
" | Bid: "+(tick.bid??"--")+
" | Ask: "+(tick.ask??"--")+
"</div>";
}
box.appendChild(div);
});
showSelected();
}

function showSelected(){
const symbol=document.getElementById("pair").value;
const tick=latest[symbol];

document.getElementById("price").innerText=
tick && tick.mid!=null ? tick.mid : "--";

document.getElementById("details").innerText=
tick ? "Bid: "+tick.bid+" | Ask: "+tick.ask+
" | "+(tick.stale?"STALE":"CHECKING FRESHNESS") :
"Waiting for selected pair data";
}

function startBot(){
botOn=true;
document.getElementById("botstatus").innerText="BOT ON";
}
function stopBot(){
botOn=false;
document.getElementById("botstatus").innerText="BOT OFF";
}

getPrices();
setInterval(getPrices,5000);
</script>
</body>
</html>
