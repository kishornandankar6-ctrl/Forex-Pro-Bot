
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forex Pro Bot</title>
<style>
body{background:#10151f;color:white;font-family:Arial;padding:15px}
h2{color:#e9bd55;text-align:center}
.card{background:#1d2939;padding:15px;margin:12px 0;border-radius:12px}
select,button{padding:12px;border-radius:8px;width:100%;margin-top:10px}
button{background:#d9ad45;border:0;font-weight:bold}
.signal{text-align:center;font-size:25px;color:#aaa}
</style>
</head>
<body>
<h2>FOREX PRO BOT</h2>
<div class="card">
<label>Select Forex Pair</label>
<select id="pair">
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>USD/JPY</option>
<option>USD/CHF</option>
<option>AUD/USD</option>
<option>NZD/USD</option>
<option>USD/CAD</option>
<option>EUR/JPY</option>
</select>
<label>Timeframe</label>
<select id="tf">
<option>1 Minute</option>
<option>5 Minutes</option>
<option>15 Minutes</option>
<option>1 Hour</option>
</select>
<button onclick="alert('Live data connection is not configured yet')">START ANALYSIS</button>
</div>
<div class="card">
<div class="signal" id="signal">WAITING FOR DATA</div>
</div>
</body>
</html>
